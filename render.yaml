services:
  - type: redis
    name: applylytics-redis
    plan: free

  - type: worker
    name: rq-worker
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker --with-scheduler
    envVars:
      - key: REDIS_URL
        fromService:
          name: applylytics-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false

  - type: web
    name: applylytics
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=10000
    envVars:
      - key: REDIS_URL
        fromService:
          name: applylytics-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
